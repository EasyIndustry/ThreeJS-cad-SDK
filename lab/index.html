<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola del Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
  /* Layout: el visor del modelo arriba (o a la izquierda), la consola abajo (o a la derecha),
     y una franja DRO —el visor de cotas de una máquina de taller— sobre la escena. */
  :root {
    --bg: #e9ece6;
    --panel: #f6f7f3;
    --ink: #1c221f;
    --muted: #5d6963;
    --line: #cdd5ce;
    --accent: #8f5410;
    --accent-soft: #f1e2cb;
    --ok: #2e6f48;
    --err: #a3271d;
    --scene: #e3dfd6;
    --grid: #b9b0a0;
    --edge: #3b2f24;
    --dro-bg: #1c221f;
    --dro-ink: #f0a640;
    --dro-dim: #8a8f85;
    --f-ui: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
    --f-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121614; --panel: #181d1a; --ink: #e4eae5; --muted: #8f9c95; --line: #29312c;
      --accent: #f0a640; --accent-soft: #3a2c17; --ok: #6cc391; --err: #f08a80;
      --scene: #1b201d; --grid: #3d4640; --edge: #120d09;
      --dro-bg: #0b0e0c; --dro-ink: #f0a640; --dro-dim: #6d7770;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121614; --panel: #181d1a; --ink: #e4eae5; --muted: #8f9c95; --line: #29312c;
    --accent: #f0a640; --accent-soft: #3a2c17; --ok: #6cc391; --err: #f08a80;
    --scene: #1b201d; --grid: #3d4640; --edge: #120d09;
    --dro-bg: #0b0e0c; --dro-ink: #f0a640; --dro-dim: #6d7770;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .marca { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .marca h1 { margin: 0; font: 600 15px/1.2 var(--f-ui); letter-spacing: .01em; }
  .marca span { color: var(--muted); font-size: 12.5px; }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: 500 12.5px/1 var(--f-ui); color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 44%) minmax(0, 1fr); } }

  .vista { position: relative; min-height: 0; min-width: 0; background: var(--scene); overflow: hidden; }
  .vista canvas { display: block; }
  .cad-label {
    font: 500 10.5px/1 var(--f-mono); color: var(--ink); white-space: nowrap; pointer-events: none;
    background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 5px;
  }
  .cad-label--assembly { background: var(--accent); color: var(--panel); border-color: var(--accent); }

  /* DRO: las cotas de la última parte que se tocó */
  .dro {
    position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 18px;
    align-items: baseline; padding: 8px 12px; border-radius: 6px; background: var(--dro-bg); color: var(--dro-ink);
    font: 400 11.5px/1.5 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: .02em;
  }
  .dro .k { color: var(--dro-dim); text-transform: uppercase; font-size: 9.5px; letter-spacing: .12em; margin-right: 6px; }
  .dro .nombre { color: #f3efe6; }
  @media (max-width: 860px) { .dro { left: 8px; right: 8px; bottom: 8px; padding: 6px 10px; gap: 2px 12px; font-size: 10.5px; } }

  .consola { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; border-left: 1px solid var(--line); background: var(--panel); }
  @media (max-width: 860px) { .consola { border-left: 0; border-top: 1px solid var(--line); } }

  .chips { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
  .chips button { font: 400 11.5px/1 var(--f-mono); white-space: nowrap; padding: 6px 8px; flex: none; }

  .log { overflow-y: auto; padding: 10px 12px 6px; font: 400 12.5px/1.55 var(--f-mono); min-width: 0; }
  .entrada { margin: 0 0 8px; min-width: 0; }
  .entrada pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
  .entrada.in pre { color: var(--accent); }
  .entrada.in pre::before { content: '› '; color: var(--muted); }
  .entrada.err pre { color: var(--err); }
  .entrada.info { color: var(--muted); font-family: var(--f-ui); font-size: 13px; line-height: 1.5; max-width: 62ch; }
  .entrada.info code { font: 400 12px var(--f-mono); color: var(--ink); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  .entrada .h { font-weight: 500; color: var(--accent); margin-bottom: 4px; }
  .lista { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; }
  .lista .i { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .lista .v { word-break: break-word; }
  .dim { color: var(--muted); }
  .tabla { overflow-x: auto; }
  .tabla table { border-collapse: collapse; width: 100%; font: 400 11.5px/1.45 var(--f-mono); }
  .tabla td { padding: 3px 12px 3px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  .tabla td:first-child { color: var(--accent); white-space: nowrap; }
  .tabla td:last-child { font-family: var(--f-ui); font-size: 12.5px; color: var(--ink); }

  .prompt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 10px 12px; border-top: 1px solid var(--line); }
  .prompt > span { font: 500 14px/34px var(--f-mono); color: var(--accent); }
  textarea {
    width: 100%; box-sizing: border-box; resize: none; min-height: 34px; max-height: 140px;
    font: 400 16px/1.4 var(--f-mono); color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  @media (min-width: 861px) { textarea { font-size: 13px; } }
  .prompt button { height: 34px; }
  .sugerencias { padding: 0 12px 8px 36px; font: 400 11.5px/1.5 var(--f-mono); color: var(--muted); min-height: 0; }
  .sugerencias:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>

</head>
<body>
<div class="app">
  <header>
    <div class="marca">
      <h1>Consola del Taller</h1>
      <span>threejs-cad-sdk, corriendo acá. Escribí abajo o tocá un ejemplo.</span>
    </div>
    <div class="acciones">
      <button id="b-demo" type="button">Cargar demo</button>
      <button id="b-vaciar" type="button">Vaciar</button>
      <button id="b-etiquetas" type="button" aria-pressed="true">Etiquetas</button>
      <button id="b-ejes" type="button" aria-pressed="false">Ejes</button>
      <button id="b-contactos" type="button" aria-pressed="false">Contactos</button>
      <button id="b-encuadrar" type="button">Encuadrar</button>
    </div>
  </header>
  <main>
    <section class="vista" id="vista" aria-label="Vista 3D del modelo">
      <div class="dro" id="dro" aria-live="polite"></div>
    </section>
    <section class="consola" aria-label="Consola">
      <div class="chips" id="chips"></div>
      <div class="log" id="log"></div>
      <div>
        <div class="prompt">
          <span aria-hidden="true">›</span>
          <textarea id="entrada" rows="1" spellcheck="false" autocomplete="off" aria-label="Comando" placeholder="taller.help()"></textarea>
          <button id="b-correr" type="button">Correr</button>
        </div>
        <div class="sugerencias" id="sugerencias"></div>
      </div>
    </section>
  </main>
</div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { CSS2DRenderer } from 'three/addons/renderers/CSS2DRenderer.js';
  import { createWorkshop, Part, Piece, Assembly, Point3d, Vector3d, Line, BoundingBox, Face, Transform, Contact, Intersection } from '../src/index.js';
  import { createThreeView } from '../adapters/three/viewer.js';
  import { demo as armarDemo } from '../examples/demo.js';

  const taller = createWorkshop();
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // ======================= visor: el adaptador de three espeja el modelo =======================
  const vista = $('vista');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  vista.prepend(renderer.domElement);
  const etiquetas = new CSS2DRenderer();
  Object.assign(etiquetas.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
  vista.insertBefore(etiquetas.domElement, $('dro'));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 1, 4000);
  camera.position.set(170, 130, 210);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 30, -40);
  controls.enableDamping = true;
  scene.add(new THREE.HemisphereLight('#fff6e8', '#7a6a58', 1.4));
  const sol = new THREE.DirectionalLight('#ffe6c4', 2.2);
  sol.position.set(120, 260, 160);
  scene.add(sol);
  const grilla = new THREE.GridHelper(400, 40);
  grilla.material.transparent = true;
  grilla.material.opacity = 0.5;
  scene.add(grilla);

  // todo lo que es del modelo lo dibuja el adaptador; la página pone escena, cámara y luces
  const cad = createThreeView(taller, { scene, colors: { highlight: css('--accent') } });
  cad.show.labels(true);
  const ver = { labels: true, axes: false, contacts: false };

  function colores() {
    scene.background = new THREE.Color(css('--scene'));
    grilla.material.color.set(css('--grid'));
  }

  let actual = null; // la última parte que se tocó: la muestra el DRO y se resalta
  const n1 = (v) => (Math.round(v * 10) / 10).toFixed(1);
  function dro() {
    const el = $('dro');
    if (!actual || !taller.model.parts.has(actual)) {
      actual = null;
      el.innerHTML = `<span><span class="k">DRO</span>${taller.model.parts.size} partes · tocá una para ver sus cotas</span>`;
      return;
    }
    const p = taller.part(actual);
    const b = p.boundingBox, c = b.center, d = b.diagonal;
    let html = `<span class="nombre">${p.id} · ${esc(p.name)}</span>`
      + `<span><span class="k">Centro</span>X ${n1(c.x)} Y ${n1(c.y)} Z ${n1(c.z)}</span>`
      + `<span><span class="k">Caja</span>${n1(d.x)} × ${n1(d.y)} × ${n1(d.z)} cm</span>`;
    if (p instanceof Piece) { const m = p.dims; html += `<span><span class="k">L·A·E</span>${n1(m.length)} × ${n1(m.width)} × ${n1(m.thickness)}</span>`; }
    else html += `<span><span class="k">Piezas</span>${p.pieces.length}</span>`;
    el.innerHTML = html;
  }

  function tocar(part) { actual = part.id; cad.highlight(actual); dro(); }
  let pendienteDro = false;
  taller.on(() => { if (!pendienteDro) { pendienteDro = true; requestAnimationFrame(() => { pendienteDro = false; if (actual && !taller.model.parts.has(actual)) cad.highlight(); dro(); }); } });

  function encuadrar(que) {
    const raices = que ? [que] : taller.roots;
    if (!raices.length) return;
    const box = raices.map((r) => r.boundingBox).reduce((x, y) => x.union(y));
    const centro = new THREE.Vector3(box.center.x, box.center.y, box.center.z);
    const radio = Math.max(25, box.diagonal.length / 2);
    const dir = camera.position.clone().sub(controls.target).normalize();
    controls.target.copy(centro);
    camera.position.copy(centro).addScaledVector(dir, (radio / Math.sin((camera.fov * Math.PI) / 360)) * 1.05);
  }

  new ResizeObserver(() => {
    const w = vista.clientWidth, h = vista.clientHeight;
    renderer.setSize(w, h);
    etiquetas.setSize(w, h);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }).observe(vista);
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); etiquetas.render(scene, camera); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', colores);
  new MutationObserver(colores).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ======================= consola =======================
  const log = $('log');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const bajar = () => { log.scrollTop = log.scrollHeight; };

  function entrada(clase, nodo) {
    const d = document.createElement('div');
    d.className = `entrada ${clase}`;
    if (typeof nodo === 'string') { const pre = document.createElement('pre'); pre.textContent = nodo; d.append(pre); }
    else d.append(nodo);
    log.append(d);
    return d;
  }
  const html = (s) => { const t = document.createElement('div'); t.innerHTML = s; return t; };
  const tieneTexto = (v) => v && typeof v === 'object' && !Array.isArray(v) && typeof v.toString === 'function' && v.toString !== Object.prototype.toString;

  function texto(v) {
    if (v === undefined) return 'undefined';
    if (v === null) return 'null';
    if (typeof v === 'string') return JSON.stringify(v);
    if (typeof v === 'function') return `ƒ ${v.name || 'anónima'}()`;
    if (tieneTexto(v)) return String(v);
    if (typeof v === 'object') {
      const pares = Object.entries(v).map(([k, x]) => `${k}: ${typeof x === 'object' && x !== null && !tieneTexto(x) ? '{…}' : texto(x)}`);
      return `{ ${pares.join(', ')} }`;
    }
    return String(v);
  }

  function mostrar(v) {
    if (v === undefined) return;
    if (Array.isArray(v)) {
      const caja = document.createElement('div');
      const lista = document.createElement('div');
      lista.className = 'lista';
      v.slice(0, 48).forEach((x, i) => { lista.append(html(`<span class="i">[${i}]</span>`).firstChild, html(`<span class="v">${esc(texto(x))}</span>`).firstChild); });
      caja.append(html(`<span class="dim">${v.length} elemento${v.length === 1 ? '' : 's'}${v.length > 48 ? ' (muestro 48)' : ''}</span>`).firstChild, lista);
      entrada('out', caja);
    } else entrada('out', texto(v));
  }

  // help() y los console.log del SDK salen acá, no en la consola del navegador
  const original = { log: console.log, table: console.table, warn: console.warn, error: console.error };
  function capturar() {
    console.log = (...args) => {
      original.log(...args);
      if (typeof args[0] === 'string' && args[0].includes('%c')) {
        const n = (args[0].match(/%c/g) || []).length;
        const d = entrada('out', ''); d.innerHTML = `<div class="h">${esc(args[0].replace(/%c/g, ''))}</div>`;
        if (args.length > n + 1) d.append(html(`<pre>${esc(args.slice(n + 1).map(texto).join(' '))}</pre>`).firstChild);
      } else entrada('out', args.map((a) => (typeof a === 'string' ? a : texto(a))).join(' '));
    };
    console.table = (rows) => {
      original.table(rows);
      ultimaTabla = rows;
      const filas = Array.isArray(rows) ? rows : Object.values(rows || {});
      const t = document.createElement('div');
      t.className = 'tabla';
      t.innerHTML = `<table><tbody>${filas.map((r) => `<tr>${Object.values(r).map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      log.lastElementChild?.classList.contains('out') ? log.lastElementChild.append(t) : entrada('out', t);
    };
    console.warn = (...a) => { original.warn(...a); entrada('err', a.map(texto).join(' ')); };
    console.error = (...a) => { original.error(...a); entrada('err', a.map(texto).join(' ')); };
  }
  function soltar() { Object.assign(console, original); }
  let ultimaTabla = null;

  // Corre en modo estricto, así escribir sobre algo de solo lectura (cubo.vertices[0].x = 99)
  // falla con un error en vez de no hacer nada en silencio. En estricto, lo que se declara
  // con const/let/var no sobrevive al comando: se reescribe a globalThis para que quede.
  const persistir = (code) => "'use strict';\n" + code
    .replace(/^(\s*)(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=(?![=>])/gm, '$1globalThis.$2 =')
    .replace(/^(\s*)([A-Za-z_$][\w$]*)\s*=(?![=>])/gm, '$1globalThis.$2 =');

  function correr(code) {
    code = code.trim();
    if (!code) return;
    entrada('in', code);
    historial = [...historial.filter((h) => h !== code), code].slice(-100);
    try { localStorage.setItem('consola-taller-historial', JSON.stringify(historial)); } catch { /* sin storage */ }
    pos = historial.length;
    capturar();
    try {
      ultimaTabla = null;
      const v = (0, eval)(persistir(code));
      if (v instanceof Part) tocar(v);
      // help() imprime su tabla y además la devuelve: no mostrarla dos veces
      if (!(v === ultimaTabla || (Array.isArray(v) && ultimaTabla && v.length === ultimaTabla.length && v.every((x, i) => x === ultimaTabla[i])))) mostrar(v);
    } catch (e) {
      entrada('err', `${e.name}: ${e.message}`);
    } finally {
      soltar();
      bajar();
    }
  }

  let historial = [];
  try { historial = JSON.parse(localStorage.getItem('consola-taller-historial') || '[]'); } catch { historial = []; }
  let pos = historial.length;

  const caja = $('entrada');
  const alto = () => { caja.style.height = 'auto'; caja.style.height = `${Math.min(140, caja.scrollHeight)}px`; };
  caja.addEventListener('input', () => { alto(); $('sugerencias').textContent = ''; });
  caja.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); correr(caja.value); caja.value = ''; alto(); return; }
    if (e.key === 'Tab') { e.preventDefault(); completar(); return; }
    const arriba = caja.selectionStart === 0 || !caja.value.slice(0, caja.selectionStart).includes('\n');
    const abajo = !caja.value.slice(caja.selectionEnd).includes('\n');
    if (e.key === 'ArrowUp' && arriba && historial.length) { e.preventDefault(); pos = Math.max(0, pos - 1); caja.value = historial[pos] ?? ''; alto(); }
    if (e.key === 'ArrowDown' && abajo && historial.length) { e.preventDefault(); pos = Math.min(historial.length, pos + 1); caja.value = historial[pos] ?? ''; alto(); }
  });
  $('b-correr').addEventListener('click', () => { correr(caja.value); caja.value = ''; alto(); caja.focus(); });

  // Tab completa miembros: solo sobre cadenas simples (cubo.local.), así completar nunca ejecuta nada
  function miembros(o) {
    const out = new Set();
    if (o === null || o === undefined) return [];
    for (let p = o; p && p !== Object.prototype && p !== Function.prototype; p = Object.getPrototypeOf(p)) {
      for (const k of Object.getOwnPropertyNames(p)) if (!['constructor', 'prototype', 'length', 'name', 'caller', 'arguments'].includes(k) && !k.startsWith('_')) out.add(k);
    }
    return [...out].sort();
  }
  function completar() {
    const antes = caja.value.slice(0, caja.selectionStart);
    const m = antes.match(/([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\.([A-Za-z_$][\w$]*)?$/);
    if (!m) return;
    let obj;
    try { obj = m[1].split('.').reduce((o, k) => o[k], window); } catch { return; }
    const opciones = miembros(obj).filter((k) => k.startsWith(m[2] || ''));
    if (!opciones.length) { $('sugerencias').textContent = 'sin coincidencias'; return; }
    let comun = opciones[0];
    for (const o of opciones) while (!o.startsWith(comun)) comun = comun.slice(0, -1);
    const resto = comun.slice((m[2] || '').length);
    if (resto) { caja.setRangeText(resto, caja.selectionStart, caja.selectionEnd, 'end'); }
    $('sugerencias').textContent = opciones.length > 1 ? opciones.join('  ') : '';
  }

  // ======================= lo que se puede escribir =======================
  const demo = () => { const r = armarDemo(taller); encuadrar(); tocar(r.bastidor); return r.bastidor; };
  const ayuda = () => {
    entrada('info', html(`Todo lo de <code>src/</code>, con el visor de <code>adapters/three/</code>. Cada clase dice lo que sabe hacer con <code>help()</code>: <code>taller.help()</code>, <code>Piece.help()</code>, <code>Assembly.help()</code>, <code>Point3d.help()</code>, <code>Transform.help()</code>, <code>Contact.help()</code>… <code>Tab</code> completa después de un punto, <code>↑</code> trae lo anterior, <code>Shift+Enter</code> hace otra línea. <code>arbol()</code> muestra el árbol, <code>ver(p)</code> muestra una parte en el DRO, <code>cls()</code> limpia esto.`));
  };
  Object.assign(window, {
    taller, cad, Piece, Assembly, Point3d, Vector3d, Line, BoundingBox, Face, Transform, Contact, Intersection,
    demo, ayuda,
    arbol: () => { entrada('out', taller.tree() || '(vacío)'); },
    parte: (id) => taller.part(id),
    ver: (p) => { tocar(typeof p === 'string' ? taller.part(p) : p); return p; },
    cls: () => { log.textContent = ''; },
  });

  const EJEMPLOS = [
    'taller.help()',
    "const cubo = taller.addPiece({ name: 'Tapa', size: [90, 1.8, 50], material: 'roble', center: [0, 80, 90] })",
    'cubo.vertices',
    'cubo.vertices[0].x',
    'cubo.vertices[0].x = 99',
    "cubo.rotate(30, 'y')",
    'cubo.local.boundingBox',
    'cubo.dims',
    'cubo.faces[0]',
    'cubo.move(cubo.vertices[0], new Point3d(0, 0, 0))',
    "parte('E-1').duplicate().move([0, 0, -160])",
    "Transform.apply(Transform.rotation(15, 'y'), taller.roots)",
    'taller.contacts()',
    'taller.collisions()',
    "parte('E-1').contactsWith(parte('E-1'))",
    'Contact.help()',
    'Piece.help()',
    'Transform.help()',
    'arbol()',
  ];
  for (const ej of EJEMPLOS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = ej;
    b.addEventListener('click', () => correr(ej));
    $('chips').append(b);
  }

  $('b-demo').addEventListener('click', () => correr('demo()'));
  $('b-vaciar').addEventListener('click', () => correr('taller.clear()'));
  $('b-encuadrar').addEventListener('click', () => encuadrar());
  for (const [id, que] of [['b-etiquetas', 'labels'], ['b-ejes', 'axes'], ['b-contactos', 'contacts']]) {
    $(id).addEventListener('click', (e) => { ver[que] = cad.show[que](!ver[que]); e.currentTarget.setAttribute('aria-pressed', String(ver[que])); });
  }

  // arranca con algo en la escena: el caso que motivó el SDK
  colores();
  demo();
  dro();
  entrada('info', html(`Arriba está <code>demo()</code>: un bastidor con una diagonal a 45°, ensamblado, parado, girado 25° y repetido. Probá los ejemplos de arriba, o escribí <code>ayuda()</code>. El botón <b>Contactos</b> pinta de verde las uniones y de rojo los choques.`));
</script>
